name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -e . pytest
      - run: pytest -q
      - run: ownerwatch events
      - run: for f in examples/*.yaml; do python -c "import ownerwatch.config as c; c.load_all('$f')"; done
      - run: cd contracts && forge install foundry-rs/forge-std --no-git && forge test -vv
