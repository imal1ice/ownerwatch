<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="ownerwatch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121D30"/>
      <stop offset="1" stop-color="#0C1422"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34E3C8"/>
      <stop offset="1" stop-color="#1FB5A6"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="8" y="8" width="384" height="384" rx="92" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="383" height="383" rx="91.5" fill="none" stroke="#2A3B55" stroke-width="1.5"/>
  <!-- shield: audit / security -->
