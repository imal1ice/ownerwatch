# Copy to .github/workflows/admin-surface.yml in your protocol's repo.
# Re-probes the contracts in ownerwatch.yaml every Monday and on demand, and fails
# when the admin surface differs from the committed report, so a changed signer,
# delay or proxy admin shows up as a red check instead of going unnoticed.
#
# First run: it fails with "no baseline yet" and prints the report; commit
# admin-surface.new.md as admin-surface.md to seed the baseline.
# Action source and inputs: https://github.com/imal1ice/ownerwatch-action
name: admin-surface
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imal1ice/ownerwatch-action@v1
        id: check
        with:
          config: ownerwatch.yaml        # set probe_rpc_url per chain, or pass rpc: ${{ secrets.RPC_URL }}
          baseline: admin-surface.md
          label: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-surface
          path: ${{ steps.check.outputs.report }}
