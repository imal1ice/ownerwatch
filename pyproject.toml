[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ownerwatch"
version = "0.16.0"
description = "Self-hosted monitor that alerts when admin keys, roles, proxies, pausers or treasuries of EVM contracts change."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["web3>=7", "pyyaml>=6", "requests>=2.31"]
keywords = ["ethereum", "evm", "solidity", "smart-contracts", "security", "access-control", "monitoring", "defi", "web3", "proxy", "timelock", "multisig", "governance", "safe", "alerting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]

[project.scripts]
ownerwatch = "ownerwatch.cli:main"

[project.urls]
Homepage = "https://github.com/imal1ice/ownerwatch"
Source = "https://github.com/imal1ice/ownerwatch"
Documentation = "https://github.com/imal1ice/ownerwatch#readme"
Issues = "https://github.com/imal1ice/ownerwatch/issues"

[tool.setuptools.packages.find]
include = ["ownerwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
